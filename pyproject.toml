[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-memory-system"
version = "0.1.0"
description = "Persistent, authorized and provenance-aware agent memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "pyyaml>=6,<7", "redis>=5,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
include = ["memory*", "models*", "database*", "apps*", "workers*", "prompts*"]

[tool.setuptools.package-data]
prompts = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable PostgreSQL database with pgvector"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

