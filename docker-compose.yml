services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory-local-only}
      MEMORY_APP_PASSWORD: ${MEMORY_APP_PASSWORD:-memory-app-local-only}
    ports:
      - "127.0.0.1:${MEMORY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - memory_postgres:/var/lib/postgresql/data
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/001-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - memory_redis:/data
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      MEMORY_DATABASE_URL: postgresql+psycopg://memory:${POSTGRES_PASSWORD:-memory-local-only}@postgres:5432/memory
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment: &runtime_environment
      MEMORY_DATABASE_URL: postgresql+psycopg://memory_app:${MEMORY_APP_PASSWORD:-memory-app-local-only}@postgres:5432/memory
      MEMORY_CREDENTIALS_FILE: /run/secrets/credentials
      MEMORY_EMBEDDING_BACKEND: ${MEMORY_EMBEDDING_BACKEND:-hash-test}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-hash-test}
      MEMORY_EMBEDDING_VERSION: ${MEMORY_EMBEDDING_VERSION:-1}
      MEMORY_EMBEDDING_DOCUMENT_PREFIX: ${MEMORY_EMBEDDING_DOCUMENT_PREFIX:-}
      MEMORY_EMBEDDING_QUERY_PREFIX: ${MEMORY_EMBEDDING_QUERY_PREFIX:-}
      MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-64}
      MEMORY_PROVIDER_BASE_URL: ${MEMORY_PROVIDER_BASE_URL:-http://host.docker.internal:11434/v1}
      MEMORY_PROVIDER_API_KEY: ${MEMORY_PROVIDER_API_KEY:-local}
      MEMORY_EMBEDDING_PROVIDER_BASE_URL: ${MEMORY_EMBEDDING_PROVIDER_BASE_URL:-}
      MEMORY_EMBEDDING_PROVIDER_API_KEY: ${MEMORY_EMBEDDING_PROVIDER_API_KEY:-}
      MEMORY_EMBEDDING_INPUT_TYPE_MODE: ${MEMORY_EMBEDDING_INPUT_TYPE_MODE:-prefix}
      MEMORY_PROVIDER_ENABLE_THINKING: ${MEMORY_PROVIDER_ENABLE_THINKING:-false}
      MEMORY_CONTEXT_TOKENIZER_FILE: ${MEMORY_CONTEXT_TOKENIZER_FILE:-}
      MEMORY_WORKER_EVENT_BATCH_SIZE: ${MEMORY_WORKER_EVENT_BATCH_SIZE:-5}
      MEMORY_WORKER_STALL_SECONDS: ${MEMORY_WORKER_STALL_SECONDS:-600}
      MEMORY_EXTRACTION_MODEL: ${MEMORY_EXTRACTION_MODEL:-qwen2.5:7b}
      MEMORY_EXTRACTION_RESPONSE_FORMAT: ${MEMORY_EXTRACTION_RESPONSE_FORMAT:-json_schema}
      MEMORY_REQUEST_TIMEOUT_SECONDS: ${MEMORY_REQUEST_TIMEOUT_SECONDS:-60}
      MEMORY_REFLECTION_BACKEND: ${MEMORY_REFLECTION_BACKEND:-rules}
      MEMORY_GENERAL_DISCOVERY_ENABLED: ${MEMORY_GENERAL_DISCOVERY_ENABLED:-false}
      MEMORY_CONTRASTIVE_DISCOVERY_ENABLED: ${MEMORY_CONTRASTIVE_DISCOVERY_ENABLED:-true}
      MEMORY_AUTONOMY_ENABLED: ${MEMORY_AUTONOMY_ENABLED:-false}
      MEMORY_AUTONOMY_ALLOWED_AGENTS: ${MEMORY_AUTONOMY_ALLOWED_AGENTS:-[]}
      MEMORY_AUTONOMY_INTERVAL_SECONDS: ${MEMORY_AUTONOMY_INTERVAL_SECONDS:-30}
      MEMORY_AUTONOMY_BATCH_SIZE: ${MEMORY_AUTONOMY_BATCH_SIZE:-20}
      MEMORY_AUTONOMY_DAILY_TOOL_CALLS: ${MEMORY_AUTONOMY_DAILY_TOOL_CALLS:-100}
      MEMORY_AUTONOMY_DAILY_MODEL_CALLS: ${MEMORY_AUTONOMY_DAILY_MODEL_CALLS:-50}
      MEMORY_REFLECTION_MODEL: ${MEMORY_REFLECTION_MODEL:-nemotron-3-ultra:cloud}
      MEMORY_CRITIC_MODEL: ${MEMORY_CRITIC_MODEL:-nemotron-3-ultra:cloud}
      MEMORY_REASONING_EFFORT: ${MEMORY_REASONING_EFFORT:-none}
      MEMORY_REFLECTION_MAX_MODEL_CANDIDATES: ${MEMORY_REFLECTION_MAX_MODEL_CANDIDATES:-1}
      MEMORY_REDIS_URL: redis://redis:6379/0
      MEMORY_RATE_LIMIT_BACKEND: ${MEMORY_RATE_LIMIT_BACKEND:-redis}
      MEMORY_REFLECTION_INTERVAL_SECONDS: ${MEMORY_REFLECTION_INTERVAL_SECONDS:-600}
      MEMORY_SERENDIPITY_INTERVAL_SECONDS: ${MEMORY_SERENDIPITY_INTERVAL_SECONDS:-3600}
      MEMORY_DAILY_INTERVAL_SECONDS: ${MEMORY_DAILY_INTERVAL_SECONDS:-86400}
      MEMORY_DREAMER_INTERVAL_SECONDS: ${MEMORY_DREAMER_INTERVAL_SECONDS:-604800}
    restart: unless-stopped
    secrets: [credentials]
    ports:
      - "127.0.0.1:${MEMORY_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "apps.worker.main"]
    environment:
      <<: *runtime_environment
      MEMORY_WORKER_CONTEXT_FILE: /run/secrets/worker_context
    secrets: [worker_context]
    restart: unless-stopped
    stop_grace_period: 8m
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
secrets:
  credentials:
    file: ./config/credentials.json
  worker_context:
    file: ./config/worker-context.json
volumes:
  memory_postgres:
  memory_redis:
